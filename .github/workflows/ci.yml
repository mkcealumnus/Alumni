name: Alumnux Phase 1 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check (tsc)
        run: npm run typecheck

      - name: Run Linting
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Vite Production Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://placeholder-ci.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-ci-anon-key"
