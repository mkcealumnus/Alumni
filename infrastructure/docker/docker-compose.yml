services:
  mysql:
    image: mysql:8.0
    container_name: alumnux-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: alumnux
      MYSQL_USER: alumnux_user
      MYSQL_PASSWORD: alumnux_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alumnux-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: alumnux-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: alumnux_user
      DATABASE_PASSWORD: alumnux_dev_password
      DATABASE_NAME: alumnux
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: development_jwt_secret_key_change_in_production_min_16_chars
      CORS_ORIGIN: http://localhost:3000,http://localhost:8081
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
