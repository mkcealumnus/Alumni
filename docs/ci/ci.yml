name: CI

on:
  push:
    branches: [main, chore/monorepo-foundation]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Workspace Typecheck
        run: pnpm run typecheck

      - name: Workspace Lint
        run: pnpm run lint

      - name: Workspace Test
        run: pnpm run test

      - name: Workspace Build
        run: pnpm run build
